services:
  mes_web:
    image: mes_web_portable:latest
    container_name: mes_web
    build:
      context: ../..
      dockerfile: docker/mes/Dockerfile.mes_web.portable
    environment:
      MES_WEB_HOST: "0.0.0.0"
      MES_WEB_PORT: "8080"
      MES_WEB_DB_ENABLED: ${MES_WEB_DB_ENABLED:-false}
      MES_WEB_DB_MIRROR_WORK_ORDERS: ${MES_WEB_DB_MIRROR_WORK_ORDERS:-false}
      MES_WEB_DB_HOST: ${MES_WEB_DB_HOST:-mes_postgres}
      MES_WEB_DB_PORT: ${MES_WEB_DB_PORT:-5432}
      MES_WEB_DB_NAME: ${MES_WEB_DB_NAME:-mes}
      MES_WEB_DB_USER: ${MES_WEB_DB_USER:-mes}
      MES_WEB_DB_PASSWORD: ${MES_WEB_DB_PASSWORD:-change_me_local_only}
      MES_WEB_DB_FAIL_OPEN: ${MES_WEB_DB_FAIL_OPEN:-false}
      MES_WEB_DB_LOG_FAILURES: ${MES_WEB_DB_LOG_FAILURES:-false}
      MES_WEB_DB_HOOK_PRODUCTION_COMPLETIONS: ${MES_WEB_DB_HOOK_PRODUCTION_COMPLETIONS:-false}
      MES_WEB_DB_HOOK_VISION_EVENTS: ${MES_WEB_DB_HOOK_VISION_EVENTS:-false}
      MES_WEB_DB_HOOK_OEE_SNAPSHOTS: ${MES_WEB_DB_HOOK_OEE_SNAPSHOTS:-false}
      MES_WEB_DB_HOOK_DOWNTIME_EVENTS: ${MES_WEB_DB_HOOK_DOWNTIME_EVENTS:-false}
      MES_WEB_DB_HOOK_MAINTENANCE_RECORDS: ${MES_WEB_DB_HOOK_MAINTENANCE_RECORDS:-false}
      MES_WEB_DB_HOOK_QUALITY_OVERRIDES: ${MES_WEB_DB_HOOK_QUALITY_OVERRIDES:-false}
      MES_WEB_DB_HOOK_STATION_EVENTS: ${MES_WEB_DB_HOOK_STATION_EVENTS:-false}
      MES_WEB_DB_HOOK_WORK_ORDER_TRANSITIONS: ${MES_WEB_DB_HOOK_WORK_ORDER_TRANSITIONS:-false}
      MES_WEB_DB_HOOK_PRODUCTION_COMPLETIONS_DRY_RUN: ${MES_WEB_DB_HOOK_PRODUCTION_COMPLETIONS_DRY_RUN:-false}
      MES_WEB_DB_HOOK_VISION_EVENTS_DRY_RUN: ${MES_WEB_DB_HOOK_VISION_EVENTS_DRY_RUN:-false}
      MES_WEB_DB_HOOK_OEE_SNAPSHOTS_DRY_RUN: ${MES_WEB_DB_HOOK_OEE_SNAPSHOTS_DRY_RUN:-false}
      MES_WEB_DB_HOOK_STATION_EVENTS_DRY_RUN: ${MES_WEB_DB_HOOK_STATION_EVENTS_DRY_RUN:-false}
      MES_WEB_DB_HOOK_WORK_ORDER_TRANSITIONS_DRY_RUN: ${MES_WEB_DB_HOOK_WORK_ORDER_TRANSITIONS_DRY_RUN:-false}
      MES_WEB_DB_SHADOW_READ_WORK_ORDERS: ${MES_WEB_DB_SHADOW_READ_WORK_ORDERS:-false}
      MES_WEB_DB_READ_WORK_ORDERS: ${MES_WEB_DB_READ_WORK_ORDERS:-false}
      MES_WEB_DB_SHADOW_READ_DASHBOARD: ${MES_WEB_DB_SHADOW_READ_DASHBOARD:-false}
      MES_WEB_DB_READ_DASHBOARD: ${MES_WEB_DB_READ_DASHBOARD:-false}
      MES_WEB_DB_STRICT_TIMESTAMP_GUARD: ${MES_WEB_DB_STRICT_TIMESTAMP_GUARD:-false}
      MESQL_API_BASE_URL: ${MESQL_API_BASE_URL:-http://ferptop:8090}
      MESQL_STATIONS: ${MESQL_STATIONS:-ASSEMBLY_01,PACKAGING_01}
      MESQL_PULL_TIMEOUT_SEC: ${MESQL_PULL_TIMEOUT_SEC:-10}
      MESQL_PUSH_TIMEOUT_SEC: ${MESQL_PUSH_TIMEOUT_SEC:-10}
      MES_WEB_OEE_RUNTIME_STATE_PATH: "/app/logs/oee_runtime_state.json"
      MES_WEB_FERP_EXPORT_PENDING_DIR: "/app/logs/ferp_exports/pending"
      MES_WEB_FERP_EXPORT_EXAMPLES_DIR: "/app/logs/ferp_exports/examples/ferp_xls_seeded"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - "${MES_PORTABLE_RUNTIME_ROOT:-C:/Users/ertun/Documents/.CODE/.DOCKER/MES}/data/logs:/app/logs"
      - "${MES_PORTABLE_RUNTIME_ROOT:-C:/Users/ertun/Documents/.CODE/.DOCKER/MES}/data/work_orders:/data/work_orders"
    restart: unless-stopped
    networks:
      - mes_net

  mes_postgres:
    image: postgres:16-alpine
    container_name: mes_postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-mes}"
      POSTGRES_USER: "${POSTGRES_USER:-mes}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me_local_only}"
    ports:
      - "5433:5432"
    volumes:
      - mes_postgres_data:/var/lib/postgresql/data
      - "${MES_PORTABLE_RUNTIME_ROOT:-C:/Users/ertun/Documents/.CODE/.DOCKER/MES}/data/db_backups:/backups"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mes_net

  mes_adminer:
    image: adminer:4
    container_name: mes_adminer
    environment:
      ADMINER_DEFAULT_SERVER: "mes_postgres"
    ports:
      - "8082:8080"
    depends_on:
      mes_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mes_net

networks:
  mes_net:
    name: mes_net

volumes:
  mes_postgres_data:
    name: mes_postgres_data
