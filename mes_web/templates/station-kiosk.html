<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>İstasyon · MES</title>
  <link rel="stylesheet" href="/static/kiosk.css">
  <link rel="stylesheet" href="/static/station-kiosk.css?v=kiosk-cards-2">
  <script type="module" src="/static/station-kiosk.js?v=kiosk-observer-1"></script>
</head>
<body class="configurable-kiosk">
  <main class="kiosk-shell operator-shell" id="operator-shell">
    <header class="topbar">
      <div><p class="eyebrow">ATÖLYE MES</p><h1 id="station-title">İstasyon</h1></div>
      <span id="version" class="progress-pill"></span>
    </header>
    <section class="card station-card station-stack operator-board" aria-label="İstasyon işi">
      <div class="operator-order">
        <p class="section-label">İş emri</p><h2 id="order">Yükleniyor</h2><p id="target" class="muted" hidden></p>
        <p id="station-state" class="muted" hidden></p>
      </div>
      <aside id="operator-support" class="station-stack" aria-label="İstasyon bilgileri" hidden>
        <p id="before" class="preserve-lines" hidden></p>
        <p id="instructions" class="preserve-lines" hidden></p>
        <div id="extra-sections" class="station-stack"></div>
        <p id="timer" class="station-timer" hidden></p>
        <p id="after" class="preserve-lines" hidden></p>
      </aside>
      <div class="operator-controls station-stack">
        <p id="observer-mode" class="section-label" hidden>Salt okunur izleme</p>
        <p id="observer-worker" class="muted" hidden></p>
        <div id="observer-content" class="station-stack" hidden></div>
        <template id="station-operation-controls">
        <form id="start" class="station-stack" hidden>
          <label>Operatör adı ve soyadı<input name="operator" maxlength="100" autocomplete="name" required></label>
          <button type="submit" class="station-primary">İşi başlat</button>
        </form>
        <div id="station-cards-idle" hidden></div>
        <div id="parked-fallback" class="station-stack" hidden></div>
        <form id="work" class="station-stack" hidden>
          <p id="worker" class="muted"></p>
          <div id="station-cards-work" hidden></div>
          <div id="work-steps" class="station-stack"></div>
          <label id="work-result" hidden>İşin sonucu<select name="result"></select></label>
          <button type="submit" class="station-primary">İşi tamamla</button>
        </form>
        </template>
        <p id="feedback" class="station-feedback" role="status"></p>
      </div>
    </section>
  </main>
</body>
</html>
